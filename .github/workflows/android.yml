name: Compilar APK y AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run www
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#1e2b3c' --iconBackgroundColorDark '#1e2b3c' --splashBackgroundColor '#efe6d2' --splashBackgroundColorDark '#1e2b3c'
      - run: npx cap sync android
      - run: node scripts/firmar.js
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: APK de prueba (debug)
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-merge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: AAB firmado para Play Store
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          ./gradlew bundleRelease
        working-directory: android
        env:
          KEYSTORE_PATH: release.jks
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: atlas-merge-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
